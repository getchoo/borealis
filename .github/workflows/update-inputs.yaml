name: Update all flake inputs

on:
  schedule:
    # run every saturday at 0:00 utc
    - cron: "0 0 * * 6"
  workflow_dispatch:

permissions: {}

jobs:
  update:
    uses: $/.github/workflows/update-lock.yaml
    with:
      commit-message: "flake: update all inputs"
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
